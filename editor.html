  <style>

    :root { --bg: #0b0b10; --panel: #121218; --line: rgba(255,255,255,.1); --mut: rgba(255,255,255,.55); --gold: #ffd978; --sat: env(safe-area-inset-top); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: #fff; font-family: 'Noto Sans KR', sans-serif; }
    .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(10px + var(--sat)) 16px 10px; background: rgba(11,11,16,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .top .logo { color: #fff; text-decoration: none; font: 900 15px Montserrat, sans-serif; letter-spacing: .08em; }
    .top .badge { padding: 4px 10px; border-radius: 99px; background: var(--gold); color: #1a1205; font: 900 11.5px 'Noto Sans KR', sans-serif; }
    .top .sp { flex: 1; }
    .top a.q { color: var(--mut); text-decoration: none; font-size: 13px; }
    .btn { appearance: none; border: 0; border-radius: 99px; padding: 10px 18px; background: var(--gold); color: #1a1205; font: 900 13.5px 'Noto Sans KR', sans-serif; cursor: pointer; }
    .btn.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.25); }
    .btn.sm { padding: 7px 12px; font-size: 12.5px; }
    .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 20px; max-width: 1180px; margin: 0 auto; padding: 18px 16px 120px; }
    .panel { display: flex; flex-direction: column; gap: 16px; }
    .box { padding: 16px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }
    .box h3 { margin: 0 0 10px; font-size: 14px; color: var(--gold); letter-spacing: .02em; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; } .field label { font-size: 12.5px; font-weight: 800; color: rgba(255,255,255,.75); }
    .input { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: #fff; font: 14px 'Noto Sans KR', sans-serif; outline: 0; }
    .input:focus { border-color: var(--gold); } textarea.input { resize: vertical; }
    .hint { font-size: 12px; color: var(--mut); line-height: 1.5; margin: 0; } .hint a { color: var(--gold); text-decoration: none; }
    .url { display: flex; align-items: center; gap: 0; } .url span { padding: 11px 0 11px 12px; color: var(--mut); font-family: Montserrat, sans-serif; font-size: 13px; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-right: 0; border-radius: 12px 0 0 12px; } .url .input { border-radius: 0 12px 12px 0; }
    .msg { font-size: 12px; margin-top: 4px; min-height: 16px; } .msg.ok { color: #9fe08f; } .msg.warn { color: #ffb4a2; }
    .hero { display: flex; gap: 12px; align-items: center; } .hero .th { width: 72px; height: 96px; border-radius: 12px; background: #1a1a22 center/cover; border: 1px solid var(--line); flex: none; }
    .ro { display: flex; flex-wrap: wrap; gap: 6px; } .ro span { padding: 6px 10px; border-radius: 99px; background: rgba(255,255,255,.06); border: 1px solid var(--line); font-size: 12.5px; }
    /* 블록 */
    .blocks { display: flex; flex-direction: column; gap: 10px; }
    .blk { padding: 12px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
    .blk .bh { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; } .blk .bh b { font-size: 13px; flex: 1; }
    .blk .bh button { appearance: none; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: #fff; cursor: pointer; font-size: 13px; }
    .blk .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .blk .input + .input, .blk .two + .input, .blk .input + .two { margin-top: 6px; }
    .blk .list { display: flex; flex-direction: column; gap: 6px; } .blk .list .r { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; align-items: center; } .blk .list .r.one { grid-template-columns: 1fr auto; } .blk .list .r.three { grid-template-columns: 90px 1fr auto; }
    .blk .list button, .blk .mini { appearance: none; border: 1px solid var(--line); background: transparent; color: #fff; border-radius: 8px; padding: 6px 9px; cursor: pointer; font-size: 12px; }
    .blk .gal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px; } .blk .gal div { position: relative; aspect-ratio: 1; border-radius: 10px; background: #1a1a22 center/cover; } .blk .gal div button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,.7); color: #fff; font-size: 12px; cursor: pointer; }
    .blk .pimg { display: flex; gap: 8px; align-items: center; margin-top: 6px; } .blk .pimg i { width: 44px; height: 44px; border-radius: 10px; background: #1a1a22 center/cover; flex: none; border: 1px solid var(--line); }
    .adds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; } .adds button { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: #fff; border-radius: 99px; padding: 8px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; } .adds button:hover { border-color: var(--gold); }

    .prev { position: sticky; top: 72px; align-self: start; }
    .phone { width: 100%; max-width: 390px; aspect-ratio: 9 / 17.5; border-radius: 36px; padding: 10px; background: #15151c; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 30px 70px rgba(0,0,0,.55); margin: 0 auto; }
    .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 28px; background: #0f1016; }
    .prev .cap { text-align: center; color: var(--mut); font-size: 12px; margin-top: 8px; }
    .mtabs { display: none; }
    @media (max-width: 900px) {
      .wrap { grid-template-columns: 1fr; padding-bottom: 90px; }
      .mtabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: rgba(11,11,16,.95); border-top: 1px solid var(--line); gap: 8px; }
      .mtabs button { flex: 1; } .mtabs .btn.ghost[aria-pressed="true"] { background: rgba(255,217,120,.15); border-color: var(--gold); color: var(--gold); }

    }
    .toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--gold); color: #1a1205; padding: 10px 18px; border-radius: 99px; font-weight: 800; font-size: 13.5px; opacity: 0; transition: .25s; pointer-events: none; z-index: 70; white-space: nowrap; }

  <header class="top"><a class="logo" href="/">TOOMCARD</a><span class="badge" id="badge">페이지</span><span class="sp"></span><a class="q" href="/dashboard" data-t="dash">내 명함 관리</a><button type="button" class="btn" id="saveBtn" data-t="save">발행</button></header>
  <main class="wrap">
    <section class="panel">
      <div class="done" id="done"><b data-t="doneT">발행했어요! 🎉</b><a class="l" id="doneUrl" href="#" target="_blank" rel="noopener"></a><div class="row"><button type="button" class="btn sm" id="copyBtn" data-t="copy">링크 복사</button><a class="btn sm ghost" id="doneOpen" href="#" target="_blank" rel="noopener" data-t="open">열어 보기</a><a class="btn sm ghost" href="/dashboard" data-t="dash">내 명함 관리</a></div></div>
      <div class="box" id="boxId">
        <h3 data-t="secId">주소</h3>
        <div class="field" id="idField"><label><span data-t="idL">아이디</span></label><div class="url"><span>toomcard.com/</span><input class="input" id="fSlug" placeholder="my.id" maxlength="20" autocapitalize="off" autocomplete="off" spellcheck="false"></div><div class="msg" id="slugMsg"></div></div>
        <p class="hint" id="attachHint"></p>
      </div>
      <div class="box">
        <h3 data-t="secHead">위쪽</h3>
        <div class="field"><label data-t="titleL">페이지 제목</label><input class="input" id="fTitle" maxlength="40"></div>
        <div id="homeOpts" hidden>
          <div class="field"><label data-t="layL">스타일</label><div class="chips" id="layChips"><button type="button" class="chip" data-lay="shop" aria-pressed="true" data-t="lay_shop">🏪 가게 홈페이지</button><button type="button" class="chip" data-lay="room" data-t="lay_room">🏠 내 방 (미니룸)</button></div><p class="hint" data-t="layH">가게·사업이면 홈페이지 스타일, 개인이면 싸이월드 같은 내 방 스타일이에요. 내용은 그대로 두고 모양만 바뀌어요.</p></div>
          <div class="field"><label data-t="skinL">스킨 (방 분위기)</label><div class="chips" id="skinChips"><button type="button" class="chip" data-skin="night" aria-pressed="true" data-t="sk_night">🌙 밤하늘</button><button type="button" class="chip" data-skin="sky" data-t="sk_sky">☁️ 하늘</button><button type="button" class="chip" data-skin="pink" data-t="sk_pink">🌸 벚꽃</button><button type="button" class="chip" data-skin="mint" data-t="sk_mint">🌿 숲</button></div></div>
          <div id="shopOnly"><div class="field"><label data-t="shopPhL">가게 전화번호 (공개)</label><input class="input" id="fShopPh" type="tel" maxlength="24" placeholder="02-123-4567"><p class="hint" data-t="shopPhH">여기에 적은 번호만 홈페이지에 공개돼요. 명함의 전화번호는 계속 비공개예요.</p></div></div>
          <div id="roomOnly"><div class="field"><label data-t="moodL">오늘의 한마디 (TODAY IS)</label><input class="input" id="fMood" maxlength="40"></div>
          <div class="field"><label data-t="bgmL">배경음악 (유튜브 주소, 선택)</label><input class="input" id="fBgm" type="text" inputmode="url" autocapitalize="off" placeholder="youtu.be/…"></div></div>
        </div>
        <div class="field" id="nameField"><label data-t="nameL">이름 · 상호</label><input class="input" id="fName" maxlength="40"></div>
        <div class="field"><label data-t="heroL">대표 사진</label><div class="hero"><div class="th" id="heroTh"></div><div><button type="button" class="btn sm ghost" id="heroBtn" data-t="heroBtn">사진 올리기</button><input type="file" id="heroFile" accept="image/*" hidden><p class="hint" id="heroHint"></p></div></div></div>
        <div class="field" id="snsField"><label data-t="snsL">SNS · 연락처 (명함에서 가져와요)</label><div class="ro" id="snsRo"></div><p class="hint" id="snsHint"></p></div>
      </div>
      <div class="box">
        <h3 data-t="secBlocks">블록</h3>
        <div class="blocks" id="blocks"></div>
        <div class="adds" id="adds"></div>
      </div>
    </section>
    <aside class="prev"><div class="phone"><iframe id="pv" title="preview"></iframe></div><div class="cap" data-t="pvCap">실제 페이지가 이렇게 보여요</div></aside>

    /* ── 불러오기: ?edit=아이디 → 그 카드에 붙인다. 없으면 내 카드 중 하나, 그것도 없으면 새 페이지 ── */
    function showCardInfo() {
      const c = card || {}; hasCard = cardExists(card);
      $('idField').hidden = !!card; $('nameField').hidden = hasCard;
      const pageUrl = `toomcard.com/${slug || '…'}${mode === 'home' ? '/page' : '/links'}`;
      $('attachHint').innerHTML = card ? `${t('addrPage')} <b>${pageUrl}</b>` + (hasCard ? ` · ${t('addrCard')} <b>toomcard.com/${slug}</b>` : ` · <a href="/maker?edit=${encodeURIComponent(slug)}">${t('makeCard')}</a>`) : t('addrNew');
      const front = c.front && c.front.bg && c.front.bg.type === 'image' ? c.front.bg.src : (c.plateCardImage || '');
      if (hasCard && front) { $('heroTh').style.backgroundImage = `url('${front}')`; $('heroBtn').hidden = true; $('heroHint').textContent = t('heroCard'); }
      else { if (front && !hero) { hero = front; $('heroTh').style.backgroundImage = `url('${front}')`; } $('heroBtn').hidden = false; $('heroHint').textContent = t('heroNew'); }
      const ro = (c.socials || []).filter((s) => s && s.url).map((s) => `<span>${esc(s.label || s.type)}</span>`).concat(c.phone ? [`<span>📞 ${esc(c.phone)}</span>`] : []).concat(c.primaryAction && c.primaryAction.url ? ['<span>🌐</span>'] : []);
      $('snsRo').innerHTML = ro.join('') || `<span style="color:var(--mut)">${t('snsNone')}</span>`;
      $('snsHint').innerHTML = card ? `<a href="/maker?edit=${encodeURIComponent(slug)}&tab=info">${t('snsEdit')}</a>` : '';
      $('fName').value = c.name || '';
    }
    function loadBlocksFrom(c) {
      const src = mode === 'home' ? (c.page || {}) : (c.ml || {});
      $('fTitle').value = src.title || '';
      if (mode === 'home') { layout = ['shop', 'room'].includes(src.layout) ? src.layout : ((c.kind === 'business' || (c.company && c.kind !== 'personal')) ? 'shop' : 'room'); paintLay(); skin = ['sky', 'pink', 'mint', 'night'].includes(src.skin) ? src.skin : 'night'; paintSkin(); $('fMood').value = src.mood || ''; $('fShopPh').value = src.phone || ''; $('fBgm').value = src.bgm || ''; }
      blocks = (src.blocks && src.blocks.length) ? JSON.parse(JSON.stringify(src.blocks)) : (mode === 'home' ? legacyToBlocks(src) : []);
      if (!blocks.length) blocks = mode === 'home' ? [{ type: 'text', text: '' }, { type: 'gallery', images: [] }, { type: 'items', list: [{}] }, { type: 'location', address: '', mapUrl: '', hours: '' }] : [{ type: 'title', text: t('tpl_links_title') }, { type: 'link', icon: '📷', title: 'Instagram', desc: '', url: '' }, { type: 'link', icon: '▶', title: 'YouTube', desc: '', url: '' }];
      renderBlocks();
    }
    async function init() {
      try { user = await getCurrentUser(); } catch (e) {}
      if (slug && typeof loadPodFromCloud === 'function') { const r = await loadPodFromCloud(slug); if (r && r.pod) { const j = r.pod.components_json || {}; card = j.card || j; } }
      if (!card && user && typeof getMyPods === 'function') {
        try { const pods = await getMyPods(); const list = (pods || []).filter((p) => p && p.slug);
          if (list.length) { const pick = list.find((p) => p.slug === localStorage.getItem('toomcard_primary_personal_slug')) || list[0]; slug = pick.slug; const j = pick.components_json || {}; card = j.card || j; } } catch (e) {}
      }
      if (!card) { slug = ''; }
      showCardInfo(); loadBlocksFrom(card || {}); updatePreview();
    }
    init();

    /* ── 발행: 같은 카드(pods)에 ml / page 만 바꿔 저장한다 ── */
    async function publish() {
      readBlocks();
      const run = async () => {
        user = await getCurrentUser(); if (!user) { toast(t('login')); return; }
        const title = $('fTitle').value.trim().slice(0, 40);
        const clean = blocks.map((b) => { const o = Object.assign({}, b); if (o.list) o.list = o.list.filter((x) => Object.values(x).some(Boolean)); if (o.items) o.items = o.items.filter((x) => x.title || x.url); return o; }).filter((b) => (b.type !== 'text' && b.type !== 'legal') || b.text).filter((b) => !['link', 'product', 'youtube'].includes(b.type) || String(b.url || '').trim()).slice(0, 24);   // 주소가 빈 링크·상품·영상 칸은 발행하지 않는다 (눌러도 아무 데도 안 가는 버튼이 생긴다)
        let c = card ? JSON.parse(JSON.stringify(card)) : null;
        if (!c) {   // 아이디가 아직 없으면 여기서 만든다 (명함은 없음 → /아이디 는 이 페이지로 넘어간다)
          const name = $('fName').value.trim(); if (!name) { toast(t('needName')); $('fName').focus(); return; }
          await checkSlug(); if (!slugOk || (slugify($('fSlug').value).length < 5 && !slugAdmin)) { toast(t('needSlug')); $('fSlug').focus(); return; }
          slug = slugify($('fSlug').value);
          c = { slug, id: slug, kind: 'personal', cardOn: false, name, role: '', company: '', slogan: '', phone: '', email: '', moatTags: [], logo: { src: '', alt: '' }, emblem: { on: true, source: 'initials', text: '', img: '', material: 'gold', shape: 'coin', motion: 'sweep' }, theme: 'obsidian', layout: 'plate', socials: [], links: [], backLayout: 'default', star: { on: false, tag: '' }, privacy: { phone: false, email: false },
            front: { bg: hero ? { type: 'image', src: hero } : { type: 'color', color: '#1a1a22', shade: 0, soft: true }, text: { layout: 'none', showLogo: false, tone: 'auto' }, finish: 'metal', qr: 'subtle', frame: 'full', frameTone: 'dark', look: 'clean' }, page: { on: false }, ml: { on: false } };
        } else if (!hasCard && hero && hero !== ((c.front && c.front.bg && c.front.bg.src) || '')) { c.front = Object.assign({}, c.front, { bg: { type: 'image', src: hero } }); }
        if (!hasCard && $('fName').value.trim()) c.name = $('fName').value.trim();
        if (mode === 'home') { let bgm = $('fBgm').value.trim(); if (bgm && !/^https?:\/\//i.test(bgm)) bgm = 'https://' + bgm; c.page = { on: true, title, blocks: clean, intro: '', gallery: [], items: [], news: [], address: '', mapUrl: '', hours: '', reviews: [], layout, phone: $('fShopPh').value.trim().slice(0, 24), skin, mood: $('fMood').value.trim().slice(0, 40), bgm }; }
        else c.ml = { on: true, title, blocks: clean };
        c.slug = slug; c.id = slug;
        $('saveBtn').disabled = true; toast(t('saving'));
        const consent = { ageConfirmed: true, lang, at: new Date().toISOString() };
        const res = await syncPodToCloud(slug, { name: c.name, handle: c.role, bio: c.company, theme: c.theme }, Object.assign({}, c, { card: c, consent }));
        $('saveBtn').disabled = false;
        if (res && res.error) { toast(t('fail') + ' ' + res.error); return; }
        card = c; showCardInfo();
        const url = `${location.origin}/${slug}${mode === 'home' ? '/page' : '/links'}`;
        $('doneUrl').textContent = url.replace(location.origin + '/', 'toomcard.com/'); $('doneUrl').href = url; $('doneOpen').href = url; $('done').classList.add('on'); $('done').scrollIntoView({ behavior: 'smooth', block: 'start' });
        toast(t('saved'));
        try { history.replaceState(null, '', `/editor?mode=${mode}&edit=${encodeURIComponent(slug)}`); } catch (e) {}
      };
      if (typeof window.requireAuth === 'function') window.requireAuth(run); else run();
    }
    $('saveBtn').addEventListener('click', publish);
    $('copyBtn').addEventListener('click', () => { navigator.clipboard.writeText($('doneUrl').href).then(() => toast(t('copied'))); });
  </script>
</body>
</html>
